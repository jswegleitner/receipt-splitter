<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt Splitter</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAWU9MLMuHpBWbnWtVwLBQbJKwZXs59hWo",
      authDomain: "receipt-splitter-a199b.firebaseapp.com",
      databaseURL: "https://receipt-splitter-a199b-default-rtdb.firebaseio.com",
      projectId: "receipt-splitter-a199b",
      storageBucket: "receipt-splitter-a199b.firebasestorage.app",
      messagingSenderId: "930736923507",
      appId: "1:930736923507:web:3efacf3a3c46870e6bdb06"
    };
    
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { Camera, Users, DollarSign, Share2, Plus, X, Check, Download, FileSpreadsheet } = lucide;

    // Simple localStorage wrapper to match the window.storage API
    window.storage = {
      get: async (key) => {
        const value = localStorage.getItem(key);
        return value ? { value } : null;
      },
      set: async (key, value) => {
        localStorage.setItem(key, value);
      }
    };

    function Icon({ icon: IconComponent, className = "", ...props }) {
      useEffect(() => {
        lucide.createIcons();
      }, []);
      
      const iconName = IconComponent.name || IconComponent.displayName || '';
      const kebabName = iconName.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
      
      return React.createElement('i', {
        'data-lucide': kebabName,
        className: className,
        ...props
      });
    }

    function ReceiptSplitter() {
      const [step, setStep] = useState('scan');
      const [items, setItems] = useState([]);
      const [people, setPeople] = useState([]);
      const [newPerson, setNewPerson] = useState('');
      const [claims, setClaims] = useState({});
      const [claimQuantities, setClaimQuantities] = useState({});
      const [selectedPerson, setSelectedPerson] = useState('');
      const [sessionId, setSessionId] = useState(null);
      const [tax, setTax] = useState(0);
      const [tip, setTip] = useState(0);
      const [tipType, setTipType] = useState('percent');
      const [isProcessing, setIsProcessing] = useState(false);
      const [ocrError, setOcrError] = useState('');
      const [rawOcrText, setRawOcrText] = useState('');
      const [showRawText, setShowRawText] = useState(false);
      const [isSharedView, setIsSharedView] = useState(false);
      const [isClaimMode, setIsClaimMode] = useState(false);
      const [showImportModal, setShowImportModal] = useState(false);
      const [importCode, setImportCode] = useState('');
      
      // Room-based collaboration
      const [roomCode, setRoomCode] = useState('');
      const [isHost, setIsHost] = useState(false);
      const [showJoinModal, setShowJoinModal] = useState(false);
      const [joinCode, setJoinCode] = useState('');
      const [roomError, setRoomError] = useState('');
      const [isConnected, setIsConnected] = useState(false);
      const isReceivingUpdate = React.useRef(false);
      const personInputRef = React.useRef(null);
      
      // Replace with your Google Cloud Vision API key
      const GOOGLE_VISION_API_KEY = localStorage.getItem('google_vision_api_key') || '';

      // Generate a short room code
      const generateRoomCode = () => {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let code = '';
        for (let i = 0; i < 5; i++) {
          code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
      };

      // Helper to sanitize data for Firebase (removes empty arrays/objects)
      const sanitizeForFirebase = (obj) => {
        if (obj === null || obj === undefined) return null;
        if (Array.isArray(obj)) {
          // Firebase doesn't like empty arrays, add placeholder
          return obj.length > 0 ? obj : ['__placeholder__'];
        }
        if (typeof obj === 'object') {
          const result = {};
          let hasKeys = false;
          for (const [key, value] of Object.entries(obj)) {
            const sanitized = sanitizeForFirebase(value);
            if (sanitized !== null && sanitized !== undefined) {
              // Skip empty arrays/objects within nested objects
              if (Array.isArray(sanitized) && sanitized.length === 0) continue;
              if (typeof sanitized === 'object' && !Array.isArray(sanitized) && Object.keys(sanitized).length === 0) continue;
              result[key] = sanitized;
              hasKeys = true;
            }
          }
          return hasKeys ? result : { __placeholder__: true };
        }
        return obj;
      };

      // Create a new room
      const createRoom = async () => {
        try {
          const code = generateRoomCode();
          const roomRef = database.ref(`rooms/${code}`);
          
          // Helper to sanitize keys for Firebase (replace periods with underscores)
          const sanitizeKey = (key) => String(key).replace(/\./g, '_');
          
          // Sanitize claims - remove empty arrays, ensure non-empty, fix keys
          const sanitizedClaims = {};
          for (const [person, itemIds] of Object.entries(claims)) {
            if (Array.isArray(itemIds) && itemIds.length > 0) {
              // Sanitize item IDs in the array
              sanitizedClaims[person] = itemIds.map(id => sanitizeKey(id));
            }
          }
          
          // Sanitize claimQuantities - remove empty objects, fix keys
          const sanitizedClaimQtys = {};
          for (const [person, qtys] of Object.entries(claimQuantities)) {
            if (qtys && typeof qtys === 'object' && Object.keys(qtys).length > 0) {
              // Sanitize item ID keys
              const sanitizedQtys = {};
              for (const [itemId, qty] of Object.entries(qtys)) {
                sanitizedQtys[sanitizeKey(itemId)] = qty;
              }
              sanitizedClaimQtys[person] = sanitizedQtys;
            }
          }
          
          // Sanitize items - ensure no undefined values
          const sanitizedItems = items.map(item => ({
            id: item.id ? String(item.id).replace(/\./g, '_') : `${Date.now()}_${Math.floor(Math.random() * 10000)}`,
            name: item.name || '',
            price: parseFloat(item.price) || 0,
            qty: parseFloat(item.qty) || 1
          }));
          
          // Build room data with proper placeholders for Firebase
          const roomData = {
            items: sanitizedItems.length > 0 ? sanitizedItems : [{ id: '__placeholder__', name: '', price: 0, qty: 0 }],
            people: people.length > 0 ? people : ['__placeholder__'],
            claims: Object.keys(sanitizedClaims).length > 0 ? sanitizedClaims : { __placeholder__: ['__placeholder__'] },
            claimQuantities: Object.keys(sanitizedClaimQtys).length > 0 ? sanitizedClaimQtys : { __placeholder__: { __placeholder__: 0 } },
            tax: parseFloat(tax) || 0,
            tip: parseFloat(tip) || 0,
            tipType: tipType || 'percent',
            createdAt: Date.now(),
            hostId: sessionId || 'unknown'
          };
          
          console.log('Creating room with data:', JSON.stringify(roomData, null, 2));
          
          await roomRef.set(roomData);
          setRoomCode(code);
          setIsHost(true);
          setIsConnected(true);
          
          // Start listening for changes
          subscribeToRoom(code);
          
          return code;
        } catch (error) {
          console.error('Error creating room:', error);
          console.error('Error details:', error.message, error.code);
          alert(`Error creating room: ${error.message || 'Please try again.'}`);
          return null;
        }
      };

      // Join an existing room
      const joinRoom = async (code) => {
        const upperCode = code.toUpperCase().trim();
        const roomRef = database.ref(`rooms/${upperCode}`);
        
        const snapshot = await roomRef.get();
        if (!snapshot.exists()) {
          setRoomError('Room not found. Check the code and try again.');
          return false;
        }
        
        const data = snapshot.val();
        setItems(data.items || []);
        setPeople(data.people || []);
        setClaims(data.claims || {});
        setClaimQuantities(data.claimQuantities || {});
        setTax(data.tax || 0);
        setTip(data.tip || 0);
        setTipType(data.tipType || 'percent');
        setRoomCode(upperCode);
        setIsHost(false);
        setIsConnected(true);
        setStep('split');
        setShowJoinModal(false);
        setJoinCode('');
        setRoomError('');
        
        // Start listening for changes
        subscribeToRoom(upperCode);
        
        return true;
      };

      // Subscribe to real-time updates
      const subscribeToRoom = (code) => {
        const roomRef = database.ref(`rooms/${code}`);
        
        roomRef.on('value', (snapshot) => {
          try {
            if (snapshot.exists()) {
              isReceivingUpdate.current = true;
              const data = snapshot.val();
              
              // Filter out placeholder data
              const cleanItems = (data.items || []).filter(i => i.id !== '__placeholder__');
              const cleanPeople = (data.people || []).filter(p => p !== '__placeholder__');
              const cleanClaims = { ...data.claims };
              delete cleanClaims.__placeholder__;
              const cleanQuantities = { ...data.claimQuantities };
              delete cleanQuantities.__placeholder__;
              
              setItems(cleanItems);
              setPeople(cleanPeople);
              setClaims(cleanClaims);
              setClaimQuantities(cleanQuantities);
              setTax(data.tax || 0);
              setTip(data.tip || 0);
              setTipType(data.tipType || 'percent');
              // Reset flag after state updates are scheduled
              setTimeout(() => { isReceivingUpdate.current = false; }, 100);
            }
          } catch (error) {
            console.error('Error receiving room update:', error);
            isReceivingUpdate.current = false;
          }
        });
      };

      // Update room data (called when changes are made)
      const updateRoom = (updates) => {
        if (!roomCode || !isConnected) return;
        
        try {
          const roomRef = database.ref(`rooms/${roomCode}`);
          
          // Sanitize data for Firebase
          const sanitizedUpdates = {
            items: updates.items?.length > 0 ? updates.items : [{ id: '__placeholder__', name: '', price: 0, qty: 0 }],
            people: updates.people?.length > 0 ? updates.people : ['__placeholder__'],
            claims: Object.keys(updates.claims || {}).length > 0 ? updates.claims : { __placeholder__: [] },
            claimQuantities: Object.keys(updates.claimQuantities || {}).length > 0 ? updates.claimQuantities : { __placeholder__: {} },
            tax: updates.tax || 0,
            tip: updates.tip || 0,
            tipType: updates.tipType || 'percent',
            updatedAt: Date.now()
          };
          
          roomRef.update(sanitizedUpdates);
        } catch (error) {
          console.error('Error updating room:', error);
        }
      };

      // Helper to sync specific fields to room
      const syncToRoom = (field, value) => {
        if (!roomCode || !isConnected || isReceivingUpdate.current) return;
        
        try {
          const roomRef = database.ref(`rooms/${roomCode}/${field}`);
          
          // Sanitize based on field type - Firebase doesn't like empty arrays/objects
          if (field === 'claims') {
            // Filter out empty arrays and ensure non-empty
            const sanitized = {};
            for (const [person, itemIds] of Object.entries(value || {})) {
              if (Array.isArray(itemIds) && itemIds.length > 0) {
                sanitized[person] = itemIds;
              }
            }
            roomRef.set(Object.keys(sanitized).length > 0 ? sanitized : { __placeholder__: ['__placeholder__'] });
          } else if (field === 'claimQuantities') {
            // Filter out empty objects
            const sanitized = {};
            for (const [person, qtys] of Object.entries(value || {})) {
              if (qtys && typeof qtys === 'object' && Object.keys(qtys).length > 0) {
                sanitized[person] = qtys;
              }
            }
            roomRef.set(Object.keys(sanitized).length > 0 ? sanitized : { __placeholder__: { __placeholder__: 0 } });
          } else if (field === 'items') {
            roomRef.set(value.length > 0 ? value : [{ id: '__placeholder__', name: '', price: 0, qty: 0 }]);
          } else if (field === 'people') {
            roomRef.set(value.length > 0 ? value : ['__placeholder__']);
          } else {
            roomRef.set(value);
          }
          
          // Also update the timestamp
          database.ref(`rooms/${roomCode}/updatedAt`).set(Date.now());
        } catch (error) {
          console.error(`Error syncing ${field}:`, error);
        }
      };

      // Clean up old rooms (>7 days) - runs on app load
      const cleanupOldRooms = async () => {
        const roomsRef = database.ref('rooms');
        const snapshot = await roomsRef.get();
        if (snapshot.exists()) {
          const rooms = snapshot.val();
          const oneWeekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
          
          Object.keys(rooms).forEach(async (code) => {
            if (rooms[code].createdAt < oneWeekAgo) {
              await database.ref(`rooms/${code}`).remove();
            }
          });
        }
      };

      // Leave room and unsubscribe
      const leaveRoom = () => {
        if (roomCode) {
          database.ref(`rooms/${roomCode}`).off();
        }
        setRoomCode('');
        setIsHost(false);
        setIsConnected(false);
      };

      // Share room link
      const shareRoomLink = async () => {
        const url = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
        
        if (navigator.share) {
          try {
            await navigator.share({
              title: 'Join my receipt split!',
              text: `Join with code: ${roomCode}`,
              url: url
            });
            return;
          } catch (e) {}
        }
        
        try {
          await navigator.clipboard.writeText(url);
          alert(`Room link copied! Share this with friends:\\n\\nCode: ${roomCode}`);
        } catch (e) {
          prompt('Share this link:', url);
        }
      };

      useEffect(() => {
        // Clean up old rooms on app load
        cleanupOldRooms();
        
        const urlParams = new URLSearchParams(window.location.search);
        const roomParam = urlParams.get('room');
        
        // Check for room code in URL
        if (roomParam) {
          joinRoom(roomParam);
          return;
        }

        const sid = urlParams.get('s');
        const shareData = urlParams.get('share');
        const claimData = urlParams.get('claim');
        
        // Check for claim mode link (friends claiming their items)
        if (claimData) {
          try {
            const decoded = JSON.parse(atob(claimData));
            setItems(decoded.items || []);
            setPeople(decoded.people || []);
            setClaims({});
            setClaimQuantities({});
            setTax(decoded.tax || 0);
            setTip(decoded.tip || 0);
            setTipType(decoded.tipType || 'percent');
            setStep('split');
            setIsClaimMode(true);
            return;
          } catch (e) {
            console.log('Invalid claim data');
          }
        }
        
        // Check for shared results view
        if (shareData) {
          try {
            const decoded = JSON.parse(atob(shareData));
            setItems(decoded.items || []);
            setPeople(decoded.people || []);
            setClaims(decoded.claims || {});
            setClaimQuantities(decoded.claimQuantities || {});
            setTax(decoded.tax || 0);
            setTip(decoded.tip || 0);
            setTipType(decoded.tipType || 'percent');
            setStep('results');
            setIsSharedView(true);
            return;
          } catch (e) {
            console.log('Invalid share data');
          }
        }
        
        if (sid) {
          setSessionId(sid);
          loadSession(sid);
        } else {
          const newId = 'session_' + Date.now();
          setSessionId(newId);
        }
      }, []);

      const loadSession = async (sid) => {
        try {
          const result = await window.storage.get(sid);
          if (result) {
            const data = JSON.parse(result.value);
            setItems(data.items || []);
            setPeople(data.people || []);
            setClaims(data.claims || {});
            setClaimQuantities(data.claimQuantities || {});
            setTax(data.tax || 0);
            setTip(data.tip || 0);
            setTipType(data.tipType || 'percent');
            setStep(data.step || 'split');
            if (data.people && data.people.length > 0) {
              setSelectedPerson(data.people[0]);
            }
          }
        } catch (e) {
          console.log('No existing session found');
        }
      };

      const saveSession = async (data) => {
        if (!sessionId) return;
        try {
          await window.storage.set(sessionId, JSON.stringify(data));
        } catch (e) {
          console.error('Failed to save session:', e);
        }
      };

      const saveApiKey = (key) => {
        localStorage.setItem('google_vision_api_key', key);
      };

      const parseReceiptText = (text) => {
        console.log('=== OCR PARSING DEBUG ===');
        console.log('Raw Text:', text);
        
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        console.log('Lines:', lines);
        
        const parsedItems = [];
        let detectedTax = 0;
        let detectedTip = 0;
        
        // Skip patterns for header/footer lines
        const skipLine = (line) => {
          // Skip very short lines (likely fragments), but allow "Tax"
          if (line.length < 3) return true;
          
          return /^(subtotal|total$|change|cash|credit card|debit|visa\b|mastercard|amex|thank|welcome|order:|receipt|store|address|phone|tel|www\.|http|server:|check\s*#|table\s|ordered:|powered|medium$|ranch$|on the side|how was|stars?|feedback|contact|tip$|authorization|approval|payment|card reader|transaction|incremental|o'brien|irish pub|irish\s|pub\s|restaurant|wilshire|santa monica|ca\s*\d{5}|\d{4}D$|xxxx|^\d+:\d+\s*(am|pm)$|^\d+\/\d+\/\d+|messages|toasttab|boulevard|the restaurant|contact info|previously provided|sale$|approved$|bbpos|jonathan|^\d{2}:\d{2}$|en's$|purveyor|download|app|get it on|application|label|reader|cardholder|contactless|time$|type$|code$|id$)/i.test(line);
        };
        
        // Check if a line looks like an address (starts with number + street name)
        const isAddressLine = (line) => {
          return /^\d+\s+\w+\s+(boulevard|blvd|street|st|avenue|ave|road|rd|drive|dr|lane|ln|way|court|ct)/i.test(line);
        };
        
        // Check if a line looks like an item name (not a price, not a skip pattern, and has reasonable content)
        const isItemNameLine = (line) => {
          // Skip if it's a price
          if (/^\$?\d+\.\d{2}$/.test(line)) return false;
          // Skip if it matches skip patterns
          if (skipLine(line)) return false;
          // Skip if it's an address
          if (isAddressLine(line)) return false;
          // Skip state/zip patterns like "Los Angeles, CA 90291"
          if (/,\s*[A-Z]{2}\s*\d{5}/.test(line)) return false;
          // Skip very long lines (likely descriptions or legal text)
          if (line.length > 60) return false;
          // Skip lines that look like restaurant/store names (usually capitalized or have special chars)
          if (/^[A-Z][a-zäöüß]+küche$/i.test(line)) return false; // e.g., Wurstküche
          // Skip location/city names
          if (/^(los angeles|new york|chicago|san francisco|seattle|denver|austin|portland|miami|boston)/i.test(line)) return false;
          // Should have at least 3 characters and contain letters
          return line.length >= 3 && /[a-zA-Z]/.test(line);
        };
        
        // Collect all items (lines starting with quantity + name, no price)
        const itemLines = [];
        // Collect all standalone prices
        const priceLines = [];
        // Track items that already have prices on same line
        const completeItems = [];
        // Track potential item names followed by prices on next line
        const itemNamesNoQty = [];
        
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          
          if (skipLine(line)) {
            console.log(`Skipping (pattern): "${line}"`);
            continue;
          }
          
          if (isAddressLine(line)) {
            console.log(`Skipping (address): "${line}"`);
            continue;
          }
          
          // Skip city/state/zip lines
          if (/,\s*[A-Z]{2}\s*\d{5}/.test(line)) {
            console.log(`Skipping (city/state/zip): "${line}"`);
            continue;
          }
          
          // Check for tax label - but be careful about what the "next price" is
          // Only set nextPriceIsTax if the VERY next line is a price
          if (/^tax$/i.test(line)) {
            // Peek at next line - only treat next price as tax if it's immediately next
            if (i + 1 < lines.length) {
              const nextLine = lines[i + 1];
              const immediatePrice = nextLine.match(/^\$?(\d+\.\d{2})$/);
              if (immediatePrice) {
                detectedTax = parseFloat(immediatePrice[1]);
                console.log(`Found Tax with price on next line: $${detectedTax}`);
                i++; // Skip the price line
                continue;
              }
            }
            console.log(`Found Tax label but no immediate price`);
            continue;
          }
          
          // Check for tax with price on same line: "Tax $11.06" or "Tax    $11.06"
          const taxMatch = line.match(/^tax\s+\$?(\d+\.\d{2})/i);
          if (taxMatch) {
            detectedTax = parseFloat(taxMatch[1]);
            console.log(`Found Tax with price on same line: $${detectedTax}`);
            continue;
          }
          
          // Check for tip label with price on next line
          if (/^tip$/i.test(line)) {
            if (i + 1 < lines.length) {
              const nextLine = lines[i + 1];
              const immediatePrice = nextLine.match(/^\$?(\d+\.\d{2})$/);
              if (immediatePrice) {
                detectedTip = parseFloat(immediatePrice[1]);
                console.log(`Found Tip with price on next line: $${detectedTip}`);
                i++; // Skip the price line
                continue;
              }
            }
            continue;
          }
          
          // Check if line is just a price
          const priceOnly = line.match(/^\$?(\d+\.\d{2})$/);
          if (priceOnly) {
            const price = parseFloat(priceOnly[1]);
            priceLines.push({ price, index: i });
            console.log(`Found price: $${price}`);
            continue;
          }
          
          // Check if line has item AND price together
          const itemWithPrice = line.match(/^(.+?)\s{2,}\$?(\d+\.\d{2})\s*$|^(.+?)\s+\$(\d+\.\d{2})\s*$/);
          if (itemWithPrice) {
            const name = (itemWithPrice[1] || itemWithPrice[3] || '').trim();
            const price = parseFloat(itemWithPrice[2] || itemWithPrice[4]);
            
            if (!/^(sub)?total$/i.test(name) && !/^tax$/i.test(name) && !/^tip$/i.test(name)) {
              const qtyMatch = name.match(/^(\d+)\s+(.+)$/);
              if (qtyMatch) {
                const qty = parseInt(qtyMatch[1]);
                // Sanity check: qty should be reasonable (< 100)
                if (qty < 100) {
                  completeItems.push({
                    qty: qty,
                    name: qtyMatch[2].trim(),
                    totalPrice: price
                  });
                  console.log(`Found complete item: ${qty}x ${qtyMatch[2]} @ $${price}`);
                }
              } else {
                completeItems.push({ qty: 1, name: name, totalPrice: price });
                console.log(`Found complete item: ${name} @ $${price}`);
              }
            }
            continue;
          }
          
          // Check if line is an item (starts with quantity)
          const itemMatch = line.match(/^(\d+)\s+(.+)$/);
          if (itemMatch) {
            const qty = parseInt(itemMatch[1]);
            const name = itemMatch[2].trim();
            
            // Sanity check: qty should be reasonable (1-99) and name should be valid
            if (qty >= 1 && qty < 100 && name.length >= 2 && !/^(sub)?total$/i.test(name)) {
              // Also skip if name looks like an address component
              if (!/boulevard|blvd|street|st|avenue|ave|road|rd/i.test(name)) {
                itemLines.push({ qty, name, index: i });
                console.log(`Found item (no price): ${qty}x ${name}`);
              } else {
                console.log(`Skipping (looks like address): ${qty} ${name}`);
              }
            } else {
              console.log(`Skipping (invalid qty or name): ${qty} ${name}`);
            }
            continue;
          }
          
          // NEW: Check if this line looks like an item name (text followed by price on next line)
          // This handles receipts where items and prices are on separate lines
          if (isItemNameLine(line)) {
            // Peek at next line to see if it's a price
            if (i + 1 < lines.length) {
              const nextLine = lines[i + 1].trim();
              const nextPriceMatch = nextLine.match(/^\$?(\d+\.\d{2})$/);
              if (nextPriceMatch) {
                const price = parseFloat(nextPriceMatch[1]);
                // Check if this looks like a quantity + item name (e.g., ".5L Bitburger")
                const qtyMatch = line.match(/^\.?(\d+(?:\.\d+)?)\s*[Ll]?\s+(.+)$/);
                if (qtyMatch && parseFloat(qtyMatch[1]) < 10) {
                  // This looks like a portion size, not a quantity (e.g., ".5L" is half liter)
                  // Treat the whole thing as the item name
                  completeItems.push({ qty: 1, name: line, totalPrice: price });
                  console.log(`Found item name + price (next line): ${line} @ $${price}`);
                } else {
                  completeItems.push({ qty: 1, name: line, totalPrice: price });
                  console.log(`Found item name + price (next line): ${line} @ $${price}`);
                }
                i++; // Skip the price line since we've used it
                continue;
              }
            }
            // If no price on next line, could still be an item - track it
            itemNamesNoQty.push({ qty: 1, name: line, index: i });
            console.log(`Found potential item name (no immediate price): ${line}`);
          }
        }
        
        console.log('=== MATCHING PHASE ===');
        console.log('Items without prices:', itemLines);
        console.log('Items without qty (names only):', itemNamesNoQty);
        console.log('Standalone prices:', priceLines);
        console.log('Complete items:', completeItems);
        console.log('Detected tax so far:', detectedTax);
        console.log('Detected tip so far:', detectedTip);
        
        // Add complete items first
        completeItems.forEach((item, idx) => {
          parsedItems.push({
            id: `${Date.now()}_${idx}_${Math.floor(Math.random() * 10000)}`,
            name: item.name,
            price: item.totalPrice / item.qty,
            qty: item.qty
          });
        });
        
        // Extract just the price values from priceLines for matching
        const priceValues = priceLines.map(p => p.price);
        
        // Figure out how many prices are for items vs footer (subtotal/tax/tip/total)
        // The footer typically has 2-4 prices at the end
        let pricesToMatch = [...priceValues];
        
        if (pricesToMatch.length > itemLines.length) {
          const numItemPrices = itemLines.length;
          const footerPrices = pricesToMatch.slice(numItemPrices);
          console.log(`Footer prices (subtotal/tax/tip/total):`, footerPrices);
          
          // Try to identify tax from footer prices
          // Common patterns:
          // [subtotal, tax, total] - tax is index 1
          // [subtotal, tax, tip, total] - tax is index 1
          // Tax is usually the smallest value in footer (except when 0)
          if (footerPrices.length >= 2 && detectedTax === 0) {
            // Find the smallest non-zero value that's less than 15% of the largest
            const maxFooter = Math.max(...footerPrices);
            const possibleTaxes = footerPrices.filter(p => p > 0 && p < maxFooter * 0.15);
            if (possibleTaxes.length > 0) {
              detectedTax = Math.min(...possibleTaxes);
              console.log(`Detected tax from footer (smallest < 15% of total): $${detectedTax}`);
            } else if (footerPrices.length >= 3) {
              // If pattern is [subtotal, tax, tip, total] or [subtotal, tax, total]
              // Tax is usually the 2nd value
              const possibleTax = footerPrices[1];
              const possibleSubtotal = footerPrices[0];
              if (possibleTax < possibleSubtotal * 0.2) {
                detectedTax = possibleTax;
                console.log(`Detected tax from footer (2nd value): $${detectedTax}`);
              }
            }
          }
          
          pricesToMatch = pricesToMatch.slice(0, numItemPrices);
        }
        
        // Match items with prices in order
        for (let i = 0; i < itemLines.length && i < pricesToMatch.length; i++) {
          const item = itemLines[i];
          const price = pricesToMatch[i];
          
          parsedItems.push({
            id: `${Date.now()}_${i}_${Math.floor(Math.random() * 10000)}`,
            name: item.name,
            price: price / item.qty,
            qty: item.qty
          });
          console.log(`Matched: ${item.qty}x ${item.name} @ $${(price/item.qty).toFixed(2)} each (total $${price})`);
        }
        
        console.log('=== FINAL RESULTS ===');
        console.log('Items:', parsedItems);
        console.log('Tax:', detectedTax);
        console.log('Tip:', detectedTip);
        
        return { items: parsedItems, tax: detectedTax, tip: detectedTip };

      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const apiKey = localStorage.getItem('google_vision_api_key');
        if (!apiKey) {
          setOcrError('Please enter your Google Cloud Vision API key first.');
          return;
        }
        
        setIsProcessing(true);
        setOcrError('');
        
        try {
          // Convert image to base64
          const base64 = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
          
          // Call Google Cloud Vision API
          const response = await fetch(
            `https://vision.googleapis.com/v1/images:annotate?key=${apiKey}`,
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                requests: [{
                  image: { content: base64 },
                  features: [{ type: 'TEXT_DETECTION' }]
                }]
              })
            }
          );
          
          const data = await response.json();
          
          if (data.error) {
            throw new Error(data.error.message);
          }
          
          if (data.responses && data.responses[0]) {
            const textAnnotations = data.responses[0].textAnnotations;
            if (textAnnotations && textAnnotations.length > 0) {
              const fullText = textAnnotations[0].description;
              setRawOcrText(fullText); // Store raw text for debugging
              const parsed = parseReceiptText(fullText);
              
              if (parsed.items.length > 0) {
                setItems(parsed.items);

            }

            setOcrError('No text found in image. Please try a clearer photo.');
          }
        } catch (error) {
          console.error('OCR Error:', error);
          setOcrError(`Error: ${error.message}. Check your API key or try again.`);

          setIsProcessing(false);
          // Reset file input

      const updateClaimQuantity = (person, itemId, quantity, clampMin = false) => {
        const newClaimQuantities = { ...claimQuantities };
        if (!newClaimQuantities[person]) newClaimQuantities[person] = {};
        const item = items.find(i => i.id === itemId);
        const maxQty = item?.qty || 1;
        // Allow decimal quantities, store 0 while typing, clamp on blur
        const parsedQty = quantity === '' ? 0 : parseFloat(quantity) || 0;
        const finalQty = clampMin ? Math.max(0.01, Math.min(parsedQty, maxQty)) : Math.min(parsedQty, maxQty);
        newClaimQuantities[person][itemId] = finalQty;
        setClaimQuantities(newClaimQuantities);
        
        // Sync to Firebase immediately (but debounce rapid changes)
        syncToRoom('claimQuantities', newClaimQuantities);

      const getClaimQuantity = (person, itemId) => {
        const qty = claimQuantities[person]?.[itemId];
        return qty !== undefined ? qty : 1;
      };

      const getTotalClaimedQuantity = (itemId) => {
        let total = 0;
        Object.keys(claims).forEach(person => {
          if (claims[person].includes(itemId)) {
            total += getClaimQuantity(person, itemId);
          }
        });
        return Math.round(total * 100) / 100; // Round to 2 decimal places
      };

      const getUnclaimedQuantity = (itemId) => {
        const item = items.find(i => i.id === itemId);
        if (!item) return 0;
        const unclaimed = item.qty - getTotalClaimedQuantity(itemId);
        return Math.round(unclaimed * 100) / 100; // Round to 2 decimal places
      };

      // Format quantity for display (hide decimals if whole number)
      const formatQty = (qty) => {

      const calculateResults = () => {
        saveSession({ items, people, claims, claimQuantities, tax, tip, tipType, step: 'results' });
        setStep('results');

      const subtotal = items.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const subtotalPlusTax = subtotal + tax;
      
      const tipAmount = tipType === 'percent' ? (subtotalPlusTax * tip / 100) : tip;
      const totalBill = subtotalPlusTax + tipAmount;

      const getPersonSubtotal = (person) => {
        const personClaims = claims[person] || [];
        let total = 0;
        
        personClaims.forEach(itemId => {
          const item = items.find(i => i.id === itemId);
          if (item) {
            const personQty = getClaimQuantity(person, itemId);
            const totalClaimedQty = getTotalClaimedQuantity(itemId);
            const itemSubtotal = item.price * item.qty;
            total += (itemSubtotal * personQty) / totalClaimedQty;
          }
        });
        
        items.forEach(item => {
          const unclaimedQty = getUnclaimedQuantity(item.id);
          if (unclaimedQty > 0) {
            const unclaimedValue = item.price * unclaimedQty;
            total += unclaimedValue / people.length;
          }
        });
        
        return total;
      };

      const getPersonTotal = (person) => {
        const personSubtotal = getPersonSubtotal(person);
        const personProportion = subtotal > 0 ? personSubtotal / subtotal : 1 / people.length;
        
        const personTax = tax * personProportion;
        const personTip = tipAmount * personProportion;
        
        return personSubtotal + personTax + personTip;
      };

                            value={item.name}
                            onChange={(e) => updateItem(item.id, 'name', e.target.value)}
                            onKeyPress={(e) => {
                              if (e.key === 'Enter') {
                                e.preventDefault();
                                addItem();
                              }
                            }}
                            placeholder="Item name"
                            className="w-full px-3 py-2 border rounded"
                          />
                        </div>
                        <div className="w-full sm:w-32">
                          <label className="block text-xs text-gray-600 mb-1 sm:hidden">Price</label>
                          <div className="relative">
                            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">$</span>
                            <input
                              type="number"
                              value={item.price === 0 ? '' : item.price}
                              onChange={(e) => updateItem(item.id, 'price', e.target.value === '' ? 0 : parseFloat(e.target.value))}
                              onKeyPress={(e) => {
                                if (e.key === 'Enter') {
                                  e.preventDefault();
                                  addItem();
                                }
                              }}
                              placeholder="0.00"
                              className="w-full pl-7 pr-3 py-2 border rounded"
                              step="0.01"
                            />
                          </div>
                        </div>
                        <div className="w-full sm:w-24">
                          <label className="block text-xs text-gray-600 mb-1 sm:hidden">Quantity</label>
                          <input
                            type="number"
                            value={item.qty === 0 ? '' : item.qty}
                            onChange={(e) => updateItem(item.id, 'qty', e.target.value === '' ? 0 : parseFloat(e.target.value))}
                            onBlur={(e) => { if (e.target.value === '' || parseFloat(e.target.value) < 0.01) updateItem(item.id, 'qty', 1); }}
                            onKeyPress={(e) => {
                              if (e.key === 'Enter') {
                                e.preventDefault();
                                addItem();
                              }
                            }}
                            placeholder="1"
                            className="w-full px-3 py-2 border rounded"
                            min="0.01"
                            step="0.01"
                          />
                        </div>
                        <button onClick={() => removeItem(item.id)} className="text-red-500 hover:text-red-700 flex-shrink-0 self-center">
                          <Icon icon={X} className="w-5 h-5" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <button onClick={addItem} className="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition mb-4 flex items-center gap-2">
                  <Icon icon={Plus} className="w-4 h-4" /> Add Item
                </button>

                <div className="border-t pt-4 mt-4">
                  <div className="bg-blue-50 p-4 rounded-lg mb-4">
                    <h3 className="font-semibold mb-3">Additional Charges</h3>
                    
                    <div className="space-y-3">
                      <div>
                        <label className="block text-sm font-medium mb-1">Tax ($)</label>
                        <input
                          type="number"
                          value={tax || ''}
                          onChange={(e) => updateTax(e.target.value)}
                          placeholder="0.00"
                          className="w-full px-3 py-2 border rounded"
                          step="0.01"
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-medium mb-1">Tip</label>
                        <div className="flex gap-2">
                          <select
                            value={tipType}
                            onChange={(e) => updateTipType(e.target.value)}
                            className="px-3 py-2 border rounded"
                          >
                            <option value="percent">%</option>
                            <option value="amount">$</option>
                          </select>
                          <input
                            type="number"
                            value={tip || ''}
                            onChange={(e) => updateTip(e.target.value)}
                            placeholder={tipType === 'percent' ? '15' : '0.00'}
                            className="flex-1 px-3 py-2 border rounded"
                            step={tipType === 'percent' ? '1' : '0.01'}
                          />
                        </div>
                        {tipType === 'percent' && tip > 0 && (
                          <div className="text-sm text-gray-600 mt-1">
                            Tip on subtotal + tax (${subtotalPlusTax.toFixed(2)}): ${tipAmount.toFixed(2)}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>

                  <div className="bg-green-50 p-4 rounded-lg mb-4">
                    <div className="flex justify-between text-sm mb-1">
                      <span>Subtotal:</span>
                      <span>${subtotal.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between text-sm mb-1">
                      <span>Tax:</span>
                      <span>${tax.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between text-sm mb-2 pb-2 border-b">
                      <span>Subtotal + Tax:</span>
                      <span className="font-medium">${subtotalPlusTax.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between text-sm mb-2">
                      <span>Tip {tipType === 'percent' ? `(${tip}%)` : ''}:</span>
                      <span>${tipAmount.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between text-xl font-bold border-t pt-2">
                      <span>Total:</span>
                      <span>${totalBill.toFixed(2)}</span>
                    </div>
                  </div>
                  
                  <h3 className="text-lg font-semibold mb-2">Add People</h3>
                  <div className="flex gap-2 mb-3">
                    <input
                      ref={personInputRef}
                      type="text"
                      value={newPerson}
                      onChange={(e) => setNewPerson(e.target.value)}
                      onKeyPress={(e) => e.key === 'Enter' && addPerson()}
                      placeholder="Name"
                      className="flex-1 px-3 py-2 border rounded"
                    />
                    <button 
                      onClick={addPerson} 
                      onMouseDown={(e) => e.preventDefault()}
                      className="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700"
                    >
                      Add
                    </button>
                  </div>

                  <div className="flex flex-wrap gap-2 mb-4">
                    {people.map(person => (
                      <span key={person} className="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full flex items-center gap-2">
                        {person}
                        <button onClick={() => removePerson(person)} className="hover:text-indigo-600">
                          <Icon icon={X} className="w-4 h-4" />
                        </button>
                      </span>
                    ))}
                  </div>

                  <button
                    onClick={startSplitting}
                    disabled={items.length === 0 || people.length === 0}
                    className="w-full bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition disabled:bg-gray-300 disabled:cursor-not-allowed"
                  >
                    Continue to Split
                  </button>
                </div>
              </div>
            )}

            {step === 'split' && (
              <div className="bg-white rounded-2xl shadow-xl p-6">
                {/* Room Code Banner */}
                {isConnected && roomCode && (
                  <div className="mb-4 p-4 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-lg text-white">
                    <div className="flex justify-between items-center flex-wrap gap-2">
                      <div>
                        <div className="text-sm opacity-90">Room Code</div>
                        <div className="text-3xl font-bold tracking-wider">{roomCode}</div>
                      </div>
                      <button
                        onClick={shareRoomLink}
                        className="bg-white text-indigo-600 px-4 py-2 rounded-lg hover:bg-indigo-50 flex items-center gap-2 font-medium"
                      >
                        <Icon icon={Share2} className="w-4 h-4" /> Invite Friends
                      </button>
                    </div>
                    <div className="text-xs mt-2 opacity-75">
                      Friends can join at {window.location.host} with this code
                    </div>
                  </div>
                )}

                {/* Create Room Button (if not in a room yet) */}
                {!isConnected && !isClaimMode && (
                  <div className="mb-4 p-4 bg-blue-50 border-2 border-dashed border-blue-300 rounded-lg">
                    <div className="flex justify-between items-center flex-wrap gap-2">
                      <div className="text-blue-800">
                        <div className="font-medium">Want friends to claim their own items?</div>
                        <div className="text-sm opacity-75">Create a room and share the code with friends</div>
                      </div>
                      <button
                        onClick={createRoom}
                        className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 flex items-center gap-2"
                      >
                        <Icon icon={Users} className="w-4 h-4" /> Create Room
                      </button>
                    </div>
                    <div className="text-xs text-blue-600 mt-2">
                      💡 Tip: All claims will sync in real-time once room is created
                    </div>
                  </div>
                )}

                <div className="flex justify-between items-center mb-4 flex-wrap gap-2">
                  <h2 className="text-2xl font-bold">
                    {isClaimMode ? `${selectedPerson || 'Select Your Name'} - Claim Items` : 'Claim Your Items'}
                  </h2>
                </div>

                {isClaimMode && (
                  <div className="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-800 text-sm">
                    <strong>Welcome!</strong> Select your name below, check off the items you ordered, then click "Submit My Claims" when done.
                  </div>
                )}

                <div className="mb-6">
                  <label className="block text-sm font-medium mb-2">Select Person:</label>
                  <select
                    value={selectedPerson}
                    onChange={(e) => setSelectedPerson(e.target.value)}
                    className="w-full px-4 py-2 border-2 border-indigo-200 rounded-lg focus:border-indigo-600 focus:outline-none"
                  >
                    {people.map(person => (
                      <option key={person} value={person}>{person}</option>
                    ))}
                  </select>
                </div>

                {selectedPerson && (
                  <div className="border rounded-lg overflow-hidden">
                    <div className="bg-indigo-600 text-white px-4 py-3 font-bold flex items-center gap-2">
                      <Icon icon={Users} className="w-5 h-5" />
                      {selectedPerson}'s Items
                    </div>
                    
                    <div className="divide-y">
                      {items.map(item => {
                        const isClaimed = claims[selectedPerson]?.includes(item.id);
                        const claimedQty = getClaimQuantity(selectedPerson, item.id);
                        const unclaimedQty = getUnclaimedQuantity(item.id);
                        const totalClaimed = getTotalClaimedQuantity(item.id);
                        
                        return (
                          <div key={item.id} className="p-4 hover:bg-gray-50">
                            <div className="flex items-center gap-4">
                              <button
                                onClick={() => toggleClaim(selectedPerson, item.id)}
                                className={`flex-shrink-0 w-6 h-6 rounded border-2 flex items-center justify-center transition ${
                                  isClaimed
                                    ? 'border-indigo-600 bg-indigo-600'
                                    : 'border-gray-300'
                                }`}
                              >
                                {isClaimed && <Icon icon={Check} className="w-4 h-4 text-white" />}
                              </button>
                              
                              <div className="flex-1">
                                <div className="font-medium">{item.name}</div>
                                <div className="text-sm text-gray-600">
                                  ${item.price.toFixed(2)} × {item.qty} = ${(item.price * item.qty).toFixed(2)}
                                </div>
                              </div>

                              {isClaimed && (
                                <div className="flex items-center gap-1 flex-wrap justify-end">
                                  <div className="flex items-center gap-1">
                                    <input
                                      type="number"
                                      min="0.01"
                                      max={item.qty}
                                      step="0.01"
                                      value={claimedQty === 0 ? '' : claimedQty}
                                      onChange={(e) => updateClaimQuantity(selectedPerson, item.id, e.target.value)}
                                      onBlur={(e) => {
                                        if (e.target.value === '' || parseFloat(e.target.value) <= 0) {
                                          toggleClaim(selectedPerson, item.id);
                                        }
                                      }}
                                      className="w-16 px-2 py-1 border rounded text-center text-sm"
                                    />
                                    <span className="text-xs text-gray-500">/{item.qty}</span>
                                  </div>
                                  {/* Quick split buttons */}
                                  <div className="flex gap-1 ml-1">
                                    <button
                                      onClick={() => updateClaimQuantity(selectedPerson, item.id, item.qty / 2)}
                                      className="px-2 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded"
                                      title="Split in half"
                                    >
                                      ½
                                    </button>
                                    <button
                                      onClick={() => updateClaimQuantity(selectedPerson, item.id, item.qty / 3)}
                                      className="px-2 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded"
                                      title="Split in thirds"
                                    >
                                      ⅓
                                    </button>
                                    <button
                                      onClick={() => updateClaimQuantity(selectedPerson, item.id, item.qty)}
                                      className="px-2 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded"
                                      title="Claim all"
                                    >
                                      All
                                    </button>
                                  </div>
                                </div>
                              )}

                              <div className="text-sm text-gray-500 w-24 text-right">
                                {unclaimedQty > 0.001 ? (
                                  <span className="text-orange-600 font-medium">
                                    {formatQty(unclaimedQty)} left
                                  </span>
                                ) : unclaimedQty < -0.001 ? (
                                  <span className="text-red-600 font-medium">
                                    Over by {formatQty(Math.abs(unclaimedQty))}
                                  </span>
                                ) : (
                                  <span className="text-green-600">
                                    ✓ All claimed
                                  </span>
                                )}
                              </div>
                            </div>
                            {/* Show who else claimed this item */}
                            {totalClaimed > 0 && (
                              <div className="mt-2 ml-10 text-xs text-gray-500">
                                {Object.keys(claims).filter(p => claims[p]?.includes(item.id)).map(p => (
                                  <span key={p} className={`inline-block mr-2 px-2 py-0.5 rounded ${p === selectedPerson ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100'}`}>
                                    {p}: {formatQty(getClaimQuantity(p, item.id))}
                                  </span>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Subtotal/Tax/Tip Summary */}
                <div className="bg-blue-50 p-4 rounded-lg mt-6">
                  <div className="text-sm space-y-1">
                    <div className="flex justify-between">
                      <span>Subtotal:</span>
                      <span className="font-medium">${subtotal.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Tax:</span>
                      <span className="font-medium">${tax.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between pb-1 border-b">
                      <span>Subtotal + Tax:</span>
                      <span className="font-medium">${subtotalPlusTax.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between pt-1">
                      <span>Tip {tipType === 'percent' ? `(${tip}%)` : ''}:</span>
                      <span className="font-medium">${tipAmount.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between font-bold text-base border-t pt-1 mt-1">
                      <span>Total:</span>
                      <span>${totalBill.toFixed(2)}</span>
                    </div>
                  </div>
                </div>

                {isClaimMode ? (
                  <>
                    <button
                      onClick={submitMyClaims}
                      disabled={!selectedPerson || !(claims[selectedPerson]?.length > 0)}
                      className="w-full mt-6 bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition disabled:bg-gray-300 disabled:cursor-not-allowed"
                    >
                      Submit My Claims
                    </button>
                    <button
                      onClick={startNewSplit}
                      className="w-full mt-3 bg-gray-200 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-300 transition"
                    >
                      Start My Own Split
                    </button>
                  </>
                ) : (
                  <>
                    <button
                      onClick={calculateResults}
                      className="w-full mt-6 bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition"
                    >
                      Calculate Split
                    </button>
                    {/* Only show back button if not in a room, or if you're the host */}
                    {(!isConnected || isHost) && (
                      <button
                        onClick={() => setStep('review')}
                        className="w-full mt-3 bg-gray-200 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-300 transition"
                      >
                        Back to Bill and People Entry
                      </button>
                    )}
                  </>
                )}
              </div>
            )}

            {/* Import Claims Modal */}
            {showImportModal && (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-2xl shadow-xl p-6 max-w-md w-full">
                  <h3 className="text-xl font-bold mb-4">Import Friend's Claims</h3>
                  <p className="text-gray-600 text-sm mb-4">
                    Paste the claim code your friend sent you:
                  </p>
                  <textarea
                    value={importCode}
                    onChange={(e) => setImportCode(e.target.value)}
                    placeholder="Paste claim code here..."
                    className="w-full px-3 py-2 border rounded-lg mb-4 h-24 font-mono text-sm"
                  />
                  <div className="flex gap-2">
                    <button
                      onClick={() => { setShowImportModal(false); setImportCode(''); }}
                      className="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={importFriendClaims}
                      className="flex-1 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700"
                    >
                      Import
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Join Room Modal */}
            {showJoinModal && (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-2xl shadow-xl p-6 max-w-md w-full">
                  <h3 className="text-xl font-bold mb-4">Join a Room</h3>
                  <p className="text-gray-600 text-sm mb-4">
                    Enter the 5-letter room code shared by your friend:
                  </p>
                  <input
                    type="text"
                    value={joinCode}
                    onChange={(e) => { setJoinCode(e.target.value.toUpperCase()); setRoomError(''); }}
                    placeholder="e.g. ABC12"
                    className="w-full px-4 py-3 border-2 rounded-lg mb-2 text-center text-2xl font-bold tracking-widest uppercase"
                    maxLength={5}
                  />
                  {roomError && (
                    <div className="text-red-600 text-sm mb-2">{roomError}</div>
                  )}
                  <div className="flex gap-2 mt-4">
                    <button
                      onClick={() => { setShowJoinModal(false); setJoinCode(''); setRoomError(''); }}
                      className="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={() => joinRoom(joinCode)}
                      disabled={joinCode.length < 5}
                      className="flex-1 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed"
                    >
                      Join Room
                    </button>
                  </div>
                </div>
              </div>
            )}

            {step === 'results' && (
              <div className="bg-white rounded-2xl shadow-xl p-6">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-2xl font-bold">
                    {isSharedView ? 'Shared Split Results' : 'Split Results'}
                  </h2>
                </div>
                
                {isSharedView && (
                  <div className="mb-4 p-3 bg-indigo-50 border border-indigo-200 rounded-lg text-indigo-700 text-sm">
                    This is a shared view of a receipt split. Start your own split below!
                  </div>
                )}
                
                <div className="space-y-3 mb-6">
                  {people.map(person => {
                    const personSubtotal = getPersonSubtotal(person);
                    const personProportion = subtotal > 0 ? personSubtotal / subtotal : 1 / people.length;
                    const personTax = tax * personProportion;
                    const personTip = tipAmount * personProportion;
                    
                    return (
                      <div key={person} className="bg-gradient-to-r from-indigo-50 to-blue-50 p-4 rounded-lg">
                        <div className="flex justify-between items-center mb-2">
                          <span className="font-bold text-lg">{person}</span>
                          <span className="text-2xl font-bold text-indigo-600">
                            ${getPersonTotal(person).toFixed(2)}
                          </span>
                        </div>
                        
                        <div className="text-sm space-y-1 mb-2">
                          <div className="flex justify-between text-gray-600">
                            <span>Items:</span>
                            <span>${personSubtotal.toFixed(2)}</span>
                          </div>
                          <div className="flex justify-between text-gray-600">
                            <span>Tax:</span>
                            <span>${personTax.toFixed(2)}</span>
                          </div>
                          <div className="flex justify-between text-gray-600">
                            <span>Tip:</span>
                            <span>${personTip.toFixed(2)}</span>
                          </div>
                        </div>
                        
                        <div className="text-sm text-gray-600 border-t pt-2">
                          {claims[person]?.map(itemId => {
                            const item = items.find(i => i.id === itemId);
                            const personQty = getClaimQuantity(person, itemId);
                            const totalClaimedQty = getTotalClaimedQuantity(itemId);
                            const itemSubtotal = item.price * item.qty;
                            const personItemCost = (itemSubtotal * personQty) / totalClaimedQty;
                            
                            return (
                              <div key={itemId}>
                                {item.name} (${personItemCost.toFixed(2)})
                                {personQty !== item.qty && ` - ${formatQty(personQty)} of ${item.qty}`}
                                {totalClaimedQty > personQty && ` - split with others`}
                              </div>
                            );
                          })}
                          
                          {items.some(item => getUnclaimedQuantity(item.id) > 0.001) && (
                            <div className="mt-2 pt-2 border-t border-gray-300">
                              <div className="font-medium text-gray-700 mb-1">Shared unclaimed items:</div>
                              {items.map(item => {
                                const unclaimedQty = getUnclaimedQuantity(item.id);
                                if (unclaimedQty > 0.001) {
                                  const unclaimedValue = item.price * unclaimedQty;
                                  const personShare = unclaimedValue / people.length;
                                  return (
                                    <div key={item.id} className="text-gray-600">
                                      {item.name} - {formatQty(unclaimedQty)} unclaimed (${personShare.toFixed(2)})
                                    </div>
                                  );
                                }
                                return null;
                              })}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="border-t pt-4 bg-green-50 p-4 rounded-lg">
                  <div className="space-y-1 text-sm">
                    <div className="flex justify-between">
                      <span>Subtotal:</span>
                      <span className="font-medium">${subtotal.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Tax:</span>
                      <span className="font-medium">${tax.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between pb-2 border-b">
                      <span>Subtotal + Tax:</span>
                      <span className="font-medium">${subtotalPlusTax.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between pt-2">
                      <span>Tip {tipType === 'percent' ? `(${tip}%)` : ''}:</span>
                      <span className="font-medium">${tipAmount.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between text-xl font-bold border-t pt-2 mt-2">
                      <span>Total Bill:</span>
                      <span>${totalBill.toFixed(2)}</span>
                    </div>
                  </div>
                </div>

                {isSharedView ? (
                  <button
                    onClick={startNewSplit}
                    className="w-full mt-4 bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition"
                  >
                    Start My Own Split
                  </button>
                ) : (
                  <>
                    <button
                      onClick={shareResults}
                      className="w-full mt-4 bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition flex items-center justify-center gap-2"
                    >
                      <Icon icon={Share2} className="w-5 h-5" /> Share Results
                    </button>
                    <button
                      onClick={() => setStep('split')}
                      className="w-full mt-3 bg-gray-200 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-300 transition"
                    >
                      Back to Edit Claims
                    </button>
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<ReceiptSplitter />, document.getElementById('root'));
  </script>
</body>
</html>
